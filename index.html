<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARA – A New Way to Connect.</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#090B13;--bg2:#141827;--pri:#7767FF;--acc:#45D9F5;--ok:#38D996;--tx:#F5F6FF}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;height:100dvh;background:radial-gradient(circle at 20% 0,#1a1740,var(--bg) 55%);color:var(--tx);font-family:Manrope,Inter,system-ui,sans-serif}
button,input{font:inherit}input{background:var(--bg2);border:1px solid #2a3050;color:var(--tx);padding:.7rem .9rem;border-radius:12px;width:100%}
button{background:linear-gradient(135deg,var(--pri),var(--acc));border:0;color:#fff;padding:.7rem 1.1rem;border-radius:12px;cursor:pointer;font-weight:700}
.center{height:100%;display:grid;place-content:center;gap:1rem;text-align:center;max-width:340px;margin:auto}
.logo{font-size:3rem;font-weight:800;letter-spacing:.3em;background:linear-gradient(135deg,var(--pri),var(--acc));-webkit-background-clip:text;color:transparent}
#app{display:grid;grid-template-columns:320px 1fr;height:100%}
aside{background:var(--bg2);padding:1rem;overflow:auto;display:flex;flex-direction:column;gap:.6rem}
.row{display:flex;gap:.6rem;align-items:center;padding:.6rem;border-radius:12px;cursor:pointer}.row:hover{background:#1e2440}
.row img{width:40px;height:40px;border-radius:50%;background:#222}
.dot{width:10px;height:10px;border-radius:50%;background:#555;margin-left:auto}.dot.on{background:var(--ok)}
main{display:flex;flex-direction:column;min-width:0}
#msgs{flex:1;overflow:auto;padding:1rem;display:flex;flex-direction:column;gap:.4rem}
.m{max-width:70%;padding:.55rem .8rem;border-radius:14px;background:var(--bg2);word-break:break-word}
.m.mine{align-self:flex-end;background:var(--pri)}.m small{display:block;opacity:.6;font-size:.7rem}
form.send{display:flex;gap:.5rem;padding:.8rem}#typing{padding:0 1rem;height:1.2rem;font-size:.8rem;color:var(--acc)}
#toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:#c0392b;padding:.7rem 1rem;border-radius:12px}
.err{color:#ff7b7b}.soon{opacity:.5}
@media(max-width:700px){#app{grid-template-columns:1fr}#app.chatting aside{display:none}#app:not(.chatting) main{display:none}}
#callui{position:fixed;inset:0;background:#000;z-index:9}#rv{width:100%;height:100%;object-fit:cover}
#lv{position:absolute;right:1rem;top:1rem;width:140px;border-radius:12px;background:#222}
#cinfo{position:absolute;top:1rem;left:1rem;display:flex;gap:.6rem;text-shadow:0 0 6px #000}
#cctl{position:absolute;bottom:1.5rem;left:0;right:0;display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
#incoming{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--bg2);padding:1rem;border-radius:16px;z-index:10;display:grid;gap:.6rem;border:1px solid var(--pri)}
.bad{background:#c0392b}
</style></head><body>
<section id="login" class="center"><div class="logo">ARA</div><p>A New Way to Connect.</p>
<button id="gbtn">Continue with Google</button></section>
<section id="setup" class="center" hidden><div class="logo">ARA</div><p>Set up your profile</p>
<input id="su-user" placeholder="Unique username (a-z, 0-9, _)" maxlength="20">
<input id="su-nick" placeholder="Nickname" maxlength="30">
<button id="su-go">Create profile</button><div id="su-err" class="err"></div></section>
<div id="app" hidden>
<aside><div class="row me"><img id="me-av"><b id="me-name"></b><button id="out" style="margin-left:auto;padding:.4rem .7rem">Logout</button></div>
<input id="q" placeholder="Search username or nickname"><div id="results"></div>
<b>Conversations</b><div id="convs"><i class="soon">No conversations yet</i></div>
<small class="soon">Voice/video calls &amp; uploads: coming soon</small></aside>
<main><div id="head" class="row"><button id="back" style="display:none">←</button><img id="h-av" hidden width="40"><b id="h-name">Select a conversation</b><span id="h-dot" class="dot"></span><button id="call-a" title="Voice call">📞</button><button id="call-v" title="Video call">🎥</button></div>
<div id="msgs"></div><div id="typing"></div>
<form class="send" id="send" hidden><input id="text" placeholder="Type a message" autocomplete="off"><button>Send</button></form></main></div>
<div id="incoming" hidden><b id="inc-name"></b><div style="display:flex;gap:.5rem"><button id="acc">Accept</button><button id="rej" class="bad">Reject</button></div></div>
<div id="callui" hidden><video id="rv" autoplay playsinline></video><video id="lv" autoplay playsinline muted></video>
<div id="cinfo"><b id="cname"></b><span id="cstat"></span><span id="cdur"></span></div>
<div id="cctl"><button id="c-mute">Mute</button><button id="c-cam">Camera off</button><button id="c-fs">Fullscreen</button><button id="c-pip">PiP</button><button id="c-end" class="bad">End</button></div></div>
<div id="toast" hidden></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getDatabase} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
export const firebaseConfig={
  apiKey:"AIzaSyDGMXGzibvhc0LslI1f7nms7Z-kGFitf8c",
  authDomain:"my-fb-11e21.firebaseapp.com",
  databaseURL:"https://my-fb-11e21-default-rtdb.firebaseio.com",
  projectId:"my-fb-11e21",
  storageBucket:"my-fb-11e21.firebasestorage.app",
  messagingSenderId:"247599477955",
  appId:"1:247599477955:web:41e1d732dd537c97441e76",
  measurementId:"G-NQCNECDYWS"
};
const app=initializeApp(firebaseConfig);
export const auth=getAuth(app),db=getFirestore(app),rtdb=getDatabase(app);

import {GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,runTransaction,serverTimestamp,collection,query,where,orderBy,limit,onSnapshot,arrayUnion,startAt,endAt} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {ref,onValue,push,set,remove,update,get,onChildAdded,onDisconnect,serverTimestamp as rts} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const $=id=>document.getElementById(id);
const avatar=s=>`https://api.dicebear.com/7.x/thumbs/svg?seed=${encodeURIComponent(s)}`;
const show=id=>["login","setup","app"].forEach(s=>$(s).hidden=s!==id);
const toast=m=>{$("toast").textContent=m;$("toast").hidden=false;setTimeout(()=>$("toast").hidden=true,4500)};
let me,activeCid,unsub=[],cache={},started=false;
const getUser=async uid=>cache[uid]||(cache[uid]=(await getDoc(doc(db,"users",uid))).data());

$("gbtn").onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}
 catch(e){toast(e.code==="auth/popup-closed-by-user"?"Login cancelled.":"Google login failed: "+e.code)}};
$("out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
 if(!u){me=null;started=false;show("login");return}
 try{const s=await getDoc(doc(db,"users",u.uid));
  if(!s.exists()){show("setup");return}
  me=s.data();startApp()}
 catch(e){toast("Database unavailable or rules not deployed ("+e.code+").")}});

$("su-go").onclick=async()=>{
 const name=$("su-user").value.trim().toLowerCase(),nick=$("su-nick").value.trim(),err=$("su-err");err.textContent="";
 if(!/^[a-z0-9_]{3,20}$/.test(name))return err.textContent="Username: 3-20 chars, a-z 0-9 _";
 if(!nick)return err.textContent="Nickname required";
 const uid=auth.currentUser.uid,p={uid,username:name,usernameLower:name,nickname:nick,nicknameLower:nick.toLowerCase(),
  photoURL:avatar(name),coverURL:"",bio:"",createdAt:serverTimestamp()};
 try{await runTransaction(db,async tx=>{const r=doc(db,"usernames",name);
   if((await tx.get(r)).exists())throw new Error("taken");
   tx.set(r,{uid});tx.set(doc(db,"users",uid),p)});
  me=p;startApp()}
 catch(e){err.textContent=e.message==="taken"?"Username already taken.":"Could not save profile: "+(e.code||e.message)}};

function startApp(){
 if(started)return;started=true;show("app");listenIncoming();
 $("me-av").src=me.photoURL;$("me-name").textContent=me.nickname;
 onValue(ref(rtdb,".info/connected"),s=>{if(!s.val())return;const conn=push(ref(rtdb,`status/${me.uid}/connections`));
  onDisconnect(conn).remove();set(conn,true);onDisconnect(ref(rtdb,`status/${me.uid}/lastSeen`)).set(rts())});
 onSnapshot(query(collection(db,"conversations"),where("participants","array-contains",me.uid)),async snap=>{
  const list=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.updatedAt?.seconds||0)-(a.updatedAt?.seconds||0));
  const box=$("convs");box.innerHTML=list.length?"":'<i class="soon">No conversations yet</i>';
  for(const c of list){const o=c.participants.find(x=>x!==me.uid),u=await getUser(o);if(!u)continue;
   const r=row(u);r.querySelector("small").textContent=c.lastMessage||"@"+u.username;box.append(r)}},
  e=>toast("Cannot load conversations: "+e.code))}

function row(u){const r=document.createElement("div");r.className="row";
 r.innerHTML=`<img src="${u.photoURL}"><div><b></b><br><small></small></div><span class="dot"></span>`;
 r.querySelector("b").textContent=u.nickname;r.querySelector("small").textContent="@"+u.username;
 onValue(ref(rtdb,`status/${u.uid}/connections`),s=>r.querySelector(".dot").classList.toggle("on",s.exists()));
 r.onclick=()=>openChat(u);return r}

let t;$("q").oninput=e=>{clearTimeout(t);t=setTimeout(async()=>{
 const q=e.target.value.trim().toLowerCase(),box=$("results");box.innerHTML="";if(!q)return;
 try{const[a,b]=await Promise.all([
  getDocs(query(collection(db,"users"),where("usernameLower","==",q))),
  getDocs(query(collection(db,"users"),orderBy("nicknameLower"),startAt(q),endAt(q+"\uf8ff"),limit(10)))]);
  const seen=new Set();[...a.docs,...b.docs].forEach(d=>{const u=d.data();
   if(u.uid===me.uid||seen.has(u.uid))return;seen.add(u.uid);cache[u.uid]=u;box.append(row(u))});
  if(!seen.size)box.innerHTML='<i class="soon">No users found</i>'}catch(e){toast("Search failed: "+e.code)}},300)};

async function openChat(u){peer=u;
 const cid=[me.uid,u.uid].sort().join("_");activeCid=cid;unsub.forEach(f=>f());unsub=[];
 $("app").classList.add("chatting");$("back").style.display="";$("back").onclick=()=>$("app").classList.remove("chatting");
 $("h-av").src=u.photoURL;$("h-av").hidden=false;$("h-name").textContent=u.nickname;$("send").hidden=false;
 try{await setDoc(doc(db,"conversations",cid),{participants:[me.uid,u.uid]},{merge:true})}catch(e){return toast("Cannot open chat: "+e.code)}
 unsub.push(onValue(ref(rtdb,`status/${u.uid}/connections`),s=>$("h-dot").classList.toggle("on",s.exists())));
 unsub.push(onValue(ref(rtdb,`typing/${cid}/${u.uid}`),s=>$("typing").textContent=s.val()?u.nickname+" is typing…":""));
 unsub.push(onSnapshot(query(collection(db,"conversations",cid,"messages"),orderBy("createdAt","desc"),limit(50)),snap=>{
  const box=$("msgs");box.innerHTML="";
  snap.docs.reverse().forEach(d=>{const m=d.data(),mine=m.from===me.uid,el=document.createElement("div");
   el.className="m"+(mine?" mine":"");el.textContent=m.text;
   const s=document.createElement("small"),tm=m.createdAt?.toDate().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})||"…";
   s.textContent=tm+(mine?(m.seenBy.length>1?" ✓✓ Seen":" ✓ Sent"):"");el.append(s);
   if(mine){const x=document.createElement("a");x.textContent=" delete";x.style.cursor="pointer";x.onclick=()=>deleteDoc(d.ref).catch(e=>toast("Delete failed: "+e.code));s.append(x)}
   if(!mine&&!m.seenBy.includes(me.uid))updateDoc(d.ref,{seenBy:arrayUnion(me.uid)}).catch(()=>{});
   box.append(el)});box.scrollTop=box.scrollHeight},e=>toast("Cannot load messages: "+e.code)))}

let tt;$("text").oninput=()=>{if(!activeCid)return;const r=ref(rtdb,`typing/${activeCid}/${me.uid}`);
 set(r,true);clearTimeout(tt);tt=setTimeout(()=>remove(r),2000)};
$("send").onsubmit=async e=>{e.preventDefault();const text=$("text").value.trim();if(!text||!activeCid)return;
 if(!navigator.onLine)return toast("You are offline.");$("text").value="";
 try{await addDoc(collection(db,"conversations",activeCid,"messages"),{from:me.uid,text,createdAt:serverTimestamp(),seenBy:[me.uid]});
  await updateDoc(doc(db,"conversations",activeCid),{lastMessage:text.slice(0,80),updatedAt:serverTimestamp()})}
 catch(err){$("text").value=text;toast("Message failed to send: "+err.code)}};

/* ===== WebRTC calls (signaling via Realtime Database) ===== */
const ICE=[{urls:"stun:stun.l.google.com:19302"}];
const TURN_ENDPOINT=""; // optional: your backend URL returning {iceServers:[...]} with temporary TURN credentials
let call=null,inc=null,peer=null;
async function iceServers(){if(!TURN_ENDPOINT)return ICE;try{const r=await fetch(TURN_ENDPOINT,{headers:{Authorization:"Bearer "+await auth.currentUser.getIdToken()}});return [...ICE,...(await r.json()).iceServers]}catch{return ICE}}
async function media(video){try{return await navigator.mediaDevices.getUserMedia({audio:true,video})}catch(e){toast(e.name==="NotAllowedError"?"Camera/microphone permission denied.":"Cannot access camera/microphone: "+e.name);return null}}
function openCallUi(name,st,video){$("callui").hidden=false;$("cname").textContent=name;$("cstat").textContent="connecting…";$("cdur").textContent="00:00";
 $("lv").srcObject=st;$("lv").hidden=!video;$("c-cam").hidden=!video;$("c-pip").hidden=!video}
function setupPc(id,side){
 const pc=new RTCPeerConnection({iceServers:call.ice});call.pc=pc;
 call.stream.getTracks().forEach(t=>pc.addTrack(t,call.stream));
 pc.ontrack=e=>{$("rv").srcObject=e.streams[0]};
 pc.onicecandidate=e=>e.candidate&&push(ref(rtdb,`calls/${id}/ice/${side}`),e.candidate.toJSON());
 pc.onconnectionstatechange=()=>{const s=pc.connectionState;if(!call)return;$("cstat").textContent=s;
  if(s==="connected"&&!call.t0){call.t0=Date.now();call.tick=setInterval(()=>{const n=Math.floor((Date.now()-call.t0)/1e3);$("cdur").textContent=String(n/60|0).padStart(2,"0")+":"+String(n%60).padStart(2,"0")},1000)}
  if(s==="failed")endCall("Connection failed (a TURN server may be needed).",true)};
 call.unsubs.push(onChildAdded(ref(rtdb,`calls/${id}/ice/${side==="caller"?"callee":"caller"}`),s=>pc.addIceCandidate(s.val()).catch(()=>{})));
 call.unsubs.push(onValue(ref(rtdb,`calls/${id}/state`),s=>{const v=s.val();
  if(["rejected","ended","missed"].includes(v))endCall(v==="rejected"?"Call rejected.":v==="missed"?"No answer.":"Call ended.",false)}));
}
async function startCall(video){
 if(!peer)return toast("Open a conversation first.");if(call)return;if(!navigator.onLine)return toast("You are offline.");
 const st=await media(video?{facingMode:"user"}:false);if(!st)return;
 const id=push(ref(rtdb,"calls")).key;call={id,video,stream:st,unsubs:[],ice:await iceServers(),role:"caller",other:peer.uid};
 openCallUi(peer.nickname,st,video);setupPc(id,"caller");const pc=call.pc;
 await pc.setLocalDescription(await pc.createOffer());
 try{await set(ref(rtdb,`calls/${id}`),{from:me.uid,to:peer.uid,video,state:"ringing",offer:{type:pc.localDescription.type,sdp:pc.localDescription.sdp}});
  await set(ref(rtdb,`incoming/${peer.uid}`),{callId:id,from:me.uid,video,name:me.nickname})}
 catch(e){return endCall("Could not start call: "+e.code,false)}
 call.unsubs.push(onValue(ref(rtdb,`calls/${id}/answer`),async s=>{const a=s.val();if(a&&!pc.currentRemoteDescription)await pc.setRemoteDescription(a)}));
 call.to=setTimeout(()=>{if(!call?.t0)update(ref(rtdb,`calls/${id}`),{state:"missed"})},30000)}
function listenIncoming(){onValue(ref(rtdb,`incoming/${me.uid}`),s=>{const v=s.val();
 if(!v){$("incoming").hidden=true;inc=null;return}
 if(call){update(ref(rtdb,`calls/${v.callId}`),{state:"rejected"});return}
 inc=v;$("inc-name").textContent=`${v.name} is ${v.video?"video":"voice"} calling…`;$("incoming").hidden=false})}
$("acc").onclick=async()=>{const v=inc;if(!v)return;$("incoming").hidden=true;
 const c=(await get(ref(rtdb,`calls/${v.callId}`))).val();
 if(!c||c.state!=="ringing"){remove(ref(rtdb,`incoming/${me.uid}`));return toast("Call is no longer available.")}
 const st=await media(v.video?{facingMode:"user"}:false);
 if(!st){update(ref(rtdb,`calls/${v.callId}`),{state:"rejected"});remove(ref(rtdb,`incoming/${me.uid}`));return}
 call={id:v.callId,video:v.video,stream:st,unsubs:[],ice:await iceServers(),role:"callee",other:v.from};
 openCallUi(v.name,st,v.video);setupPc(v.callId,"callee");const pc=call.pc;
 try{await pc.setRemoteDescription(c.offer);await pc.setLocalDescription(await pc.createAnswer());
  await update(ref(rtdb,`calls/${v.callId}`),{answer:{type:pc.localDescription.type,sdp:pc.localDescription.sdp},state:"active"})}
 catch(e){endCall("Call setup failed: "+(e.code||e.name),true)}
 remove(ref(rtdb,`incoming/${me.uid}`))};
$("rej").onclick=()=>{if(!inc)return;update(ref(rtdb,`calls/${inc.callId}`),{state:"rejected"});remove(ref(rtdb,`incoming/${me.uid}`))};
function endCall(msg,notify=true){if(!call)return;const c=call;call=null;
 clearTimeout(c.to);clearInterval(c.tick);c.unsubs.forEach(f=>f());c.pc?.close();c.stream.getTracks().forEach(t=>t.stop());
 $("rv").srcObject=null;$("lv").srcObject=null;$("callui").hidden=true;
 if(document.pictureInPictureElement)document.exitPictureInPicture().catch(()=>{});
 if(notify)update(ref(rtdb,`calls/${c.id}`),{state:"ended"}).catch(()=>{});
 if(c.role==="caller"){remove(ref(rtdb,`incoming/${c.other}`)).catch(()=>{});setTimeout(()=>remove(ref(rtdb,`calls/${c.id}`)).catch(()=>{}),5000)}
 if(msg)toast(msg)}
$("call-a").onclick=()=>startCall(false);$("call-v").onclick=()=>startCall(true);
$("c-end").onclick=()=>endCall("",true);
$("c-mute").onclick=e=>{const t=call?.stream.getAudioTracks();t?.forEach(x=>x.enabled=!x.enabled);e.target.textContent=t?.[0]?.enabled?"Mute":"Unmute"};
$("c-cam").onclick=e=>{const t=call?.stream.getVideoTracks();t?.forEach(x=>x.enabled=!x.enabled);e.target.textContent=t?.[0]?.enabled?"Camera off":"Camera on"};
$("c-fs").onclick=()=>$("callui").requestFullscreen?.().catch(()=>{});
$("c-pip").onclick=()=>$("rv").requestPictureInPicture?.().catch(()=>toast("Picture-in-Picture not supported here."));

</script></body></html>
