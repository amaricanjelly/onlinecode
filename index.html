<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ARA — A New Way to Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090B13;
    --bg-2: #141827;
    --primary: #7767FF;
    --accent: #45D9F5;
    --success: #38D996;
    --text: #F5F6FF;
    --muted: #8A8FA8;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: grid;
    place-items: center;
    overflow: hidden;
    position: relative;
  }
  /* Animated aurora background */
  .aurora {
    position: fixed;
    inset: -20%;
    background:
      radial-gradient(40% 30% at 20% 20%, rgba(119,103,255,0.35), transparent 60%),
      radial-gradient(35% 30% at 80% 30%, rgba(69,217,245,0.25), transparent 60%),
      radial-gradient(45% 35% at 50% 85%, rgba(119,103,255,0.22), transparent 60%);
    filter: blur(40px);
    animation: drift 18s ease-in-out infinite alternate;
    z-index: 0;
  }
  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-3%, 2%) scale(1.08); }
  }

  .card {
    position: relative;
    z-index: 1;
    width: min(420px, 92vw);
    background: linear-gradient(180deg, rgba(20,24,39,0.92), rgba(9,11,19,0.92));
    border: 1px solid rgba(119,103,255,0.18);
    border-radius: 24px;
    padding: 40px 32px 32px;
    box-shadow:
      0 30px 80px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.04);
    backdrop-filter: blur(20px);
    animation: rise 0.7s cubic-bezier(.2,.9,.3,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: center;
    margin-bottom: 8px;
  }
  .logo-mark {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: conic-gradient(from 220deg, var(--primary), var(--accent), var(--primary));
    display: grid; place-items: center;
    font-weight: 800; font-size: 20px;
    color: #0B0D17;
    box-shadow: 0 8px 30px rgba(119,103,255,0.55);
  }
  .logo-text {
    font-size: 28px; font-weight: 800; letter-spacing: 0.5px;
    background: linear-gradient(90deg, var(--text), var(--accent));
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .tagline {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 32px;
  }

  .welcome {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .welcome-sub {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 28px;
  }

  .btn-google {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 14px 18px;
    border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,0.08);
    background: linear-gradient(180deg, #1B2033, #151928);
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .btn-google:hover:not(:disabled) {
    transform: translateY(-1px);
    border-color: rgba(119,103,255,0.5);
    box-shadow: 0 10px 30px rgba(119,103,255,0.25);
  }
  .btn-google:active:not(:disabled) { transform: translateY(0); }
  .btn-google:disabled { opacity: 0.6; cursor: not-allowed; }

  .btn-google svg { width: 20px; height: 20px; flex-shrink: 0; }

  .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.25);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .btn-google.loading .spinner { display: inline-block; }
  .btn-google.loading .g-icon { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error {
    margin-top: 16px;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(255,80,80,0.1);
    border: 1px solid rgba(255,80,80,0.3);
    color: #FF8080;
    font-size: 13px;
    display: none;
  }
  .error.show { display: block; }

  .footer-note {
    margin-top: 28px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
  }
  .footer-note a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
  <div class="aurora"></div>

  <main class="card">
    <div class="logo">
      <div class="logo-mark">A</div>
      <div class="logo-text">ARA</div>
    </div>
    <p class="tagline">A New Way to Connect.</p>

    <h1 class="welcome">Welcome back</h1>
    <p class="welcome-sub">Sign in to continue to your conversations.</p>

    <button id="googleBtn" class="btn-google" type="button">
      <span class="spinner" aria-hidden="true"></span>
      <svg class="g-icon" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.5-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.3 35.1 26.8 36 24 36c-5.2 0-9.6-3.1-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.2 5.2C41 35.6 44 30.3 44 24c0-1.3-.1-2.5-.4-3.5z"/>
      </svg>
      <span class="label">Continue with Google</span>
    </button>

    <div id="errorBox" class="error" role="alert"></div>

    <p class="footer-note">
      By continuing you agree to ARA's<br>
      <a href="#">Terms</a> &amp; <a href="#">Privacy Policy</a>.
    </p>
  </main>

<script type="module">
  // ============================================================
  // IMPORTANT: Paste your real Firebase Web API key below.
  // Get it from: Firebase Console → Project Settings → Your apps
  // → ARA → SDK setup and configuration → apiKey
  // The login button will NOT work until this is set.
  // ============================================================
  const firebaseConfig = {
    apiKey: "PASTE_YOUR_ACTUAL_API_KEY_HERE",
    authDomain: "my-fb-11e21.firebaseapp.com",
    databaseURL: "https://my-fb-11e21-default-rtdb.firebaseio.com",
    projectId: "my-fb-11e21",
    storageBucket: "my-fb-11e21.firebasestorage.app",
    messagingSenderId: "247599477955",
    appId: "1:247599477955:web:41e1d732dd537c97441e76"
  };

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const btn      = document.getElementById("googleBtn");
  const label    = btn.querySelector(".label");
  const errorBox = document.getElementById("errorBox");

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add("show");
  }
  function clearError() {
    errorBox.classList.remove("show");
    errorBox.textContent = "";
  }
  function setLoading(on) {
    btn.disabled = on;
    btn.classList.toggle("loading", on);
    label.textContent = on ? "Signing in…" : "Continue with Google";
  }

  // If the API key isn't set, fail fast with a clear message.
  if (!firebaseConfig.apiKey || firebaseConfig.apiKey.includes("PASTE_YOUR")) {
    showError("Firebase API key is missing. Open this file and paste your real API key into firebaseConfig.apiKey.");
    btn.disabled = true;
  } else {
    const app      = initializeApp(firebaseConfig);
    const auth     = getAuth(app);
    const provider = new GoogleAuthProvider();

    setPersistence(auth, browserLocalPersistence).catch(() => {});

    // If already signed in, redirect straight to dashboard.
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.replace("dashboard.html");
      }
    });

    btn.addEventListener("click", async () => {
      clearError();
      setLoading(true);
      try {
        await signInWithPopup(auth, provider);
        // onAuthStateChanged will handle the redirect.
      } catch (err) {
        setLoading(false);
        const map = {
          "auth/popup-blocked":          "Your browser blocked the sign-in popup. Allow popups for this site and try again.",
          "auth/popup-closed-by-user":   "Sign-in was cancelled. Please try again.",
          "auth/cancelled-popup-request":"Another sign-in is already in progress.",
          "auth/network-request-failed": "Network error. Check your internet connection.",
          "auth/unauthorized-domain":    "This domain is not authorized in Firebase. Add it under Authentication → Settings → Authorized domains.",
          "auth/operation-not-allowed":  "Google sign-in is not enabled in your Firebase project."
        };
        showError(map[err.code] || ("Sign-in failed: " + (err.message || err.code)));
        console.error("Login error:", err);
      }
    });
  }
</script>
</body>
</html>
